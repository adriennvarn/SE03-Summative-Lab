<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API-Based Dictionary</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" defer src="index.js"></script>
</head>

<body>
    <header>
        <h1>Dictionary - SE03 Summative Lab</h1>
    </header>
    <main>
        <section id="search-form">
            <form>
                <input type="text" id="search" name="search" placeholder="Enter a word to search">
                <input type="submit" id="submit" name="submit" value="Search">
            </form>
        </section>
        <section id="results">
            <h2 id="word"></h2>
            <p id="phonetic"></p>
            <audio controls class="hidden">
            </audio>
            <hr>
            <div id="meanings">

            </div>
        </section>
        <div id="error-message" class="hidden">
            <h4>Error Message Placeholder</h4>
        </div>
    </main>
    <footer>
        <ul>
            <li><a href="github.com/adriennvarn">My GitHub</a></li>
            <li id="copyright">©2026 Adrienn Varn</li>
        </ul>
    </footer>
</body>

</html>
